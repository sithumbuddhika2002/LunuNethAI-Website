<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Grass HD Comparison</title>
<style>
  body { margin: 0; background: #0a101d; display: flex; flex-direction: column; gap: 40px; padding: 20px; color: white; font-family: sans-serif; }
  .preview-box { position: relative; width: 900px; height: 500px; background: #0f172a; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; overflow: hidden; }
  .corner-left { position: absolute; bottom: 0; left: 0; width: 300px; pointer-events: none; }
  .corner-right { position: absolute; bottom: 0; right: 0; width: 300px; transform: scaleX(-1); pointer-events: none; }
  .title { position: absolute; top: 40px; left: 40px; z-index: 20; }
  .title h3 { margin: 0 0 8px 0; font-size: 28px; }
  .title p { margin: 0; color: #94a3b8; }
</style>
</head>
<body>
  <h2>Candidate 1: grass_corner_hd.png (1194x711 High Res Octane 3D)</h2>
  <div class="preview-box">
    <div class="title"><h3>LunuNeth AI</h3><p>Razor-sharp corner blades</p></div>
    <img src="/images/grass_corner_hd.png" class="corner-left">
    <img src="/images/grass_corner_hd.png" class="corner-right">
  </div>

  <h2>Candidate 2: grass_foliage_hd.png (900x959 High Res Studio 3D)</h2>
  <div class="preview-box">
    <div class="title"><h3>LunuNeth AI</h3><p>Lush upright foliage leaves</p></div>
    <img src="/images/grass_foliage_hd.png" class="corner-left">
    <img src="/images/grass_foliage_hd.png" class="corner-right">
  </div>
</body>
</html>
